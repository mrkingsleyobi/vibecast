apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: TimescaleDB
    type: postgres
    url: timescaledb:5432
    database: trading_platform
    user: trading_app
    secureJsonData:
      password: 'change_me_in_production'
    jsonData:
      sslmode: 'disable'
      postgresVersion: 1500
      timescaledb: true
    editable: false

  - name: Redis
    type: redis-datasource
    url: redis-master-1:7001
    editable: false
