version: '3.8'

services:
  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:3000/api
    volumes:
      - ./data:/app/data
      - agentdb_data:/app/data/trustswarm.db
    depends_on:
      - mcp-server
    restart: unless-stopped

  # MCP Server
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    ports:
      - "3001:3001"
    environment:
      - AGENTDB_PATH=/data/trustswarm.db
      - MCP_TRANSPORT=sse,stdio
    volumes:
      - agentdb_data:/data
    restart: unless-stopped

volumes:
  agentdb_data:
    driver: local
